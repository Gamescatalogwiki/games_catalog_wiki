name: Sync catalogo desde Airtable

on:
  # Boton manual: Actions -> Sync catalogo desde Airtable -> Run workflow
  workflow_dispatch:
    inputs:
      allow_shrink:
        description: 'Publicar aunque el catalogo se achique a la mitad o menos'
        type: boolean
        default: false


# Sin esto la Action puede leer el repo pero no commitear.
permissions:
  contents: write

concurrency:
  group: sync-catalogo
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generar data/catalog.js desde Airtable
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          ALLOW_SHRINK: ${{ inputs.allow_shrink && '1' || '0' }}
        run: node tools/airtable-export.mjs

      # Parche temporal: suma los titulos de data/games-extra.json que todavia no
      # estan en la tabla Games de Airtable. Cuando esten todos cargados alla, se
      # borra este paso junto con el script y el json.
      - name: Sumar titulos de data/games-extra.json
        run: node tools/apply-extras.mjs

      - name: Validar el catalogo generado
        run: node tools/validate-catalog.mjs

      # index.html tambien cambia: apply-extras.mjs le pega la version al src de
      # data/catalog.js para que el navegador no sirva el catalogo viejo cacheado.
      - name: Commitear si cambio algo
        run: |
          if git diff --quiet -- data/catalog.js index.html; then
            echo "Sin cambios en el catalogo. No se commitea nada."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog.js index.html
          git commit -m "catalogo: sync desde Airtable"
          git push
